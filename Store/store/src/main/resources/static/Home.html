<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            padding: 48px 56px;
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        h1 { color: #3a7a0d; margin-bottom: 10px; }
        p  { color: #555; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #6db33f;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #3a7a0d; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🍃 Hello Home</h1>
        <p>Welcome to the Spring Boot Learning Project. Explore the theory guide to understand
           how Spring Boot works, its architecture, and how to get started.</p>
        <a class="btn" href="/SpringBootTheory.html">📖 Spring Boot Theory Guide</a>
    </div>
</body>
</html>
